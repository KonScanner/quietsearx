# SearXNG local settings. Values that are not set here come from the defaults.
use_default_settings: true

general:
  instance_name: "Local SearXNG"
  debug: false

server:
  # The value comes from the SEARXNG_SECRET environment variable.
  secret_key: ""
  base_url: false
  # The limiter is off. A local instance does not need rate limits.
  limiter: false
  public_instance: false
  image_proxy: true
  method: "GET"

search:
  safe_search: 0
  # No autocomplete. The browser sends every prefix to a suggestion service,
  # which learns the query before it is complete. Blank turns it off.
  autocomplete: ""
  # No favicon resolver. A resolver receives the host of every result, so a
  # third party can profile the searches. Blank turns it off.
  favicon_resolver: ""
  default_lang: "en"
  formats:
    - html
    - json
    - csv
    - rss

# Onion engines need Tor. SearXNG does not load them when no Tor proxy is set,
# and it writes one error line per engine at every start. These two entries
# keep that noise out of the log. Delete them when you turn on the tor profile.
engines:
  - name: ahmia
    inactive: true
  - name: torch
    inactive: true
  # General engines that answer from this network. Bing, Mwmbl and Seznam
  # return results here. See README.md for the test that measured this.
  - name: bing
    disabled: false
  - name: mwmbl
    disabled: false
  - name: seznam
    disabled: false
  # General engines that this network cannot use. They answer with a CAPTCHA,
  # a suspension or an access denial, so each search would wait for the error
  # and spend the rate limit of the instance. Re-enable one after a check with
  # `make engines`.
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: google cse
    disabled: true

ui:
  static_use_hash: true
  # Keep the query out of the page title. Titles reach the browser history,
  # window managers, and screen recordings.
  query_in_title: false
  default_theme: simple
  theme_args:
    simple_style: auto
  infinite_scroll: true
  hotkeys: default

valkey:
  url: redis://valkey:6379/0

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
  pool_connections: 100
  pool_maxsize: 20
  # HTTP/2 gives a distinct TLS fingerprint. HTTP/1.1 looks more common.
  enable_http2: false
  # Do not add a suffix to the user agent. A suffix identifies your instance.
  useragent_suffix: ""

  # --- OPT-IN: send every engine request through Tor ---
  # 1. Remove the "#" from the five lines below.
  # 2. Run: docker compose --profile tor up -d
  # Read the warning in README.md first. Some engines block Tor exit nodes.
  # Note: also delete the two onion engine entries in the "engines" block
  # above, or ahmia and torch stay inactive.
  #
  # using_tor_proxy: true
  # extra_proxy_timeout: 30
  # proxies:
  #   all://:
  #     - socks5h://tor:9050
